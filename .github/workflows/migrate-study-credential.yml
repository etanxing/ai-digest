name: Transfer deployment credential to Study
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install encryption library
        run: npm install --prefix "$RUNNER_TEMP/credential-seal" --no-audit --no-fund libsodium-wrappers@0.7.15
      - name: Encrypt for Study repository
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TARGET_KEY: jwgW+ASFFFwWk+SyOpXN2119+gHWQper9VZgEOai1xQ=
          TARGET_KEY_ID: '3380204578043523366'
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const sodium = require(process.env.RUNNER_TEMP + '/credential-seal/node_modules/libsodium-wrappers');
          sodium.ready.then(() => {
            if (!process.env.CF_API_TOKEN) throw new Error('Source secret is missing');
            const key = sodium.from_base64(process.env.TARGET_KEY, sodium.base64_variants.ORIGINAL);
            const sealed = sodium.crypto_box_seal(sodium.from_string(process.env.CF_API_TOKEN), key);
            fs.mkdirSync(process.env.RUNNER_TEMP + '/sealed-study-credential');
            fs.writeFileSync(process.env.RUNNER_TEMP + '/sealed-study-credential/secret.json', JSON.stringify({
              key_id: process.env.TARGET_KEY_ID,
              encrypted_value: sodium.to_base64(sealed, sodium.base64_variants.ORIGINAL),
            }));
            console.log('Credential encrypted for Study repository');
          });
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-study-credential
          path: ${{ runner.temp }}/sealed-study-credential/secret.json
          retention-days: 1
